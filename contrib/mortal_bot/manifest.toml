manifest_version = 1

[bot]
name        = "mortal"
display     = "Mortal"
description = "Equim-chan/Mortal (deep RL, Mortal v4 checkpoint). 4-player only."
version     = "0.1.0"
supported_modes = ["4p"]

[settings.model_path]
type    = "string"
label   = "Checkpoint file"
default = "mortal.pth"
help    = "Path of the Mortal .pth checkpoint; relative paths are inside this bot's folder."

[settings.show_top_n]
type    = "int"
label   = "Candidates shown"
default = 3
min     = 1
max     = 8
step    = 1
help    = "How many of Mortal's top actions the Bot Show tile lists."

[settings.aggression]
type    = "float"
label   = "Aggression"
default = 0.3
min     = 0.0
max     = 1.0
step    = 0.05
help    = "0 = Mortal as trained. Higher leans toward riichi and chi/pon in close decisions (up to +0.6 / +0.4 on their Q-values); clear folds are unaffected."

[settings.second_choice_threshold]
type    = "float"
label   = "Second choice: minimum share"
default = 0.18
min     = 0.05
max     = 0.5
step    = 0.01
help    = "The runner-up is considered only when its share (as shown in the Bot panel) is at least this."

[settings.second_choice_rate]
type    = "float"
label   = "Second choice: rate"
default = 0.3
min     = 0.0
max     = 1.0
step    = 0.05
help    = "Chance of playing the runner-up = rate x (its share / the top share). 0 turns it off. Never applies to winning or abortive draws."
