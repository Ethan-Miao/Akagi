[project]
name = "akagi-mortal-bot"
version = "0.1.0"
description = "Mortal (Equim-chan/Mortal) as an Akagi v3 mjai bot."
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }

# PyPI's Windows torch wheels are CPU-only, which is what this bot runs on
# (one decision is ~20 ms on a laptop CPU). `libriichi.pyd` is built for
# CPython 3.12, the version Akagi bundles — hence the upper bound.
dependencies = [
    "torch >=2.4",
    "numpy >=1.26",
]

[tool.uv]
package = false
